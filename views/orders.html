<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>拉絲漢堡 - 購物車</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .cart-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .item-info {
            flex: 2;
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .item-price {
            color: #666;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }
        .quantity-control button {
            background: #eee;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .quantity-control button:hover {
            background: #ddd;
        }
        .quantity-control span {
            font-size: 16px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
        .item-subtotal {
            flex: 1;
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            color: #e63946;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 16px;
            margin-left: 20px;
        }
        .cart-summary {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 20px;
            text-align: right;
        }
        .order-form {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .submit-btn {
            background: #ffb703;
            color: #111;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #fb8500;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">購物車明細</div>
        <div>
            <a href="/" style="color: white; text-decoration: none;">回前台首頁</a>
        </div>
    </div>

    <div class="cart-container">
        <h2>🛒 您的點購商品</h2>
        
        <div id="cart-container-list"></div>

        <div class="cart-summary">
            <span style="font-size: 18px; color: #666;">訂單總計：</span>
            <span id="total-amount" style="font-size: 28px; font-weight: bold; color: #e63946;">$0</span>
        </div>

        <div class="order-form" id="order-form-block">
            <h3>📝 填寫外送 / 自取資料</h3>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="username">訂購人姓名</label>
                    <input type="text" id="username" placeholder="請輸入您的姓名" required>
                </div>
                <div class="form-group">
                    <label for="phone">聯絡電話</label>
                    <input type="tel" id="phone" placeholder="請輸入手機號碼" required>
                </div>
                <div class="form-group">
                    <label for="info">外送地址 / 自取時間說明</label>
                    <textarea id="info" rows="3" placeholder="例如：自取請填寫預計取餐時間；外送請填寫完整地址與外送備註" required></textarea>
                </div>
                <button type="submit" class="submit-btn">🚀 確認資料，送出訂單</button>
            </form>
        </div>
    </div>

    <script>
        // 從瀏覽器的 localStorage 讀取購物車資料
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // 新增：切換分頁按鈕的函式
        function switchTab(status) {
            currentTab = status;
            
            // 抓取兩個按鈕元素
            const btnPending = document.getElementById('tab-pending');
            const btnCompleted = document.getElementById('tab-completed');

            // 根據切換的狀態，動態改變按鈕的高亮顏色
            if (status === '處理中') {
                btnPending.style.background = '#f4a261';
                btnPending.style.color = 'white';
                btnCompleted.style.background = '#ccc';
                btnCompleted.style.color = '#555';
            } else {
                btnPending.style.background = '#ccc';
                btnPending.style.color = '#555';
                btnCompleted.style.background = '#2a9d8f';
                btnCompleted.style.color = 'white';
            }

            // 重新刷一次畫面
            loadOrders();
        }

        // 載入並渲染所有訂單
        function loadOrders() {
            fetch('/api/orders')
                .then(res => res.json())
                .then(orders => {
                    const tbody = document.getElementById('order-list-body');
                    tbody.innerHTML = "";

                    // 🚀【核心分類邏輯】：根據目前 currentTab 的狀態，過濾出對應的訂單
                    const filteredOrders = orders.filter(order => order.status === currentTab);

                    // 如果該分頁沒有任何訂單，呈現提示字
                    if (filteredOrders.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#999; padding:40px;">目前沒有【${currentTab}】的訂單喔！</td></tr>`;
                        return;
                    }

                    // 改用過濾後的陣列 (filteredOrders) 進行畫面渲染
                    filteredOrders.forEach(order => {
                        // 解開存入時被轉成字串的購物車商品陣列
                        const items = JSON.parse(order.items);
                        
                        let itemsHtml = '<ul class="items-list">';
                        items.forEach(item => {
                            itemsHtml += `<li> ${item.name} x ${item.quantity} ($${item.price * item.quantity})</li>`;
                        });
                        itemsHtml += '</ul>';

                        // 格式化時間，呈現符合台灣習慣的格式
                        const orderTime = new Date(order.created_at).toLocaleString('zh-TW');

                        // 根據訂單狀態，決定要顯示什麼標籤與按鈕
                        let statusHtml = "";
                        if (order.status === '已完成') {
                            statusHtml = `<span style="display: inline-block; margin-top: 5px; color: #2a9d8f; font-weight: bold;">🟢 已完成</span>`;
                        } else {
                            statusHtml = `
                                <span style="display: inline-block; margin-top: 5px; color: #f4a261; font-weight: bold;">🟠 處理中</span>
                                <button onclick="completeOrder(${order.id})" style="display: block; margin-top: 8px; background: #2a9d8f; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;">
                                    ✅ 完成訂單
                                </button>
                            `;
                        }

                        // 額外加上：不論狀態如何，老闆都可以點擊的紅色的「刪除紀錄」按鈕
                        statusHtml += `
                            <button onclick="deleteOrder(${order.id})" style="display: block; margin-top: 8px; background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%;">
                                🗑️ 刪除紀錄
                            </button>
                        `;

                        tbody.innerHTML += `
                            <tr>
                                <td><strong>#${order.id}</strong></td>
                                <td style="font-size: 14px; color: #666;">${orderTime}</td>
                                <td>
                                    <strong>${order.name}</strong><br>
                                    <span style="font-size:14px; color:#666;">📞 ${order.phone}</span>
                                </td>
                                <td>${order.info}</td>
                                <td>${itemsHtml}</td>
                                <td>
                                    <div style="color:#e63946; font-size:18px; font-weight:bold; margin-bottom: 5px;">$${order.total}</div>
                                    <hr style="border:0; border-top:1px solid #eee; margin:5px 0;">
                                    ${statusHtml}
                                </td>
                            </tr>
                        `;
                    });
                })
                .catch(err => {
                    console.error("撈取訂單失敗:", err);
                });
        }

        // 點擊按鈕後將訂單改為已完成
        function completeOrder(id) {
            if (confirm(`確定要將訂單 #${id} 標記為已完成嗎？`)) {
                fetch(`/api/orders/${id}/complete`, {
                    method: 'POST'
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        loadOrders(); // 重新載入，該筆訂單會自動從「待處理」消失，跑到「歷史已完成」去！
                    } else {
                        alert("錯誤：" + data.message);
                    }
                })
                .catch(err => console.error("更新失敗:", err));
            }
        }

        // 點擊按鈕後刪除訂單
        function deleteOrder(id) {
            if (confirm(`⚠️ 警告：確定要永久刪除訂單 #${id} 嗎？`)) {
                fetch(`/api/orders/${id}`, {
                    method: 'DELETE'
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        loadOrders(); 
                    } else {
                        alert("錯誤：" + data.message);
                    }
                })
                .catch(err => console.error("刪除失敗:", err));
            }
        }

        // 網頁開啟時執行
        renderCart();
    </script>
</body>
</html>
