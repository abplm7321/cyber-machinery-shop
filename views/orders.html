<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>訂單管理後台</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* 針對訂單表格的美化樣式 */
        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .order-table th, .order-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }
        .order-table th {
            background-color: #111;
            color: #ffb703;
            font-weight: bold;
        }
        .order-table tr:hover {
            background-color: #f9f9f9;
        }
        .items-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .items-list li {
            margin-bottom: 5px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">📋訂單總覽</div>
        <div>
            <a href="/admin" style="margin-right: 20px; color: white; text-decoration: none;">商品管理</a>
            <a href="/" style="color: white; text-decoration: none;">回前台首頁</a>
        </div>
    </div>

    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
        <div style="flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #e63946;">
            <div style="font-size: 14px; color: #666; font-weight: bold;">💰 今日總營業額</div>
            <div id="stat-total-money" style="font-size: 28px; font-weight: bold; color: #e63946; margin-top: 5px;">$0</div>
        </div>
        <div style="flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #f4a261;">
            <div style="font-size: 14px; color: #666; font-weight: bold;">🟠 未處理訂單數</div>
            <div id="stat-pending-count" style="font-size: 28px; font-weight: bold; color: #f4a261; margin-top: 5px;">0 筆</div>
        </div>
        <div style="flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #2a9d8f;">
            <div style="font-size: 14px; color: #666; font-weight: bold;">🟢 已完成訂單數</div>
            <div id="stat-completed-count" style="font-size: 28px; font-weight: bold; color: #2a9d8f; margin-top: 5px;">0 筆</div>
        </div>
    </div>

    <div style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
        <h2>🛒 目前所有客戶訂單</h2>
        
        <div style="display: flex; gap: 10px; margin-top: 20px; margin-bottom: 20px;">
            <button id="tab-pending" onclick="switchTab('處理中')" style="background: #f4a261; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                ⏳ 待處理訂單
            </button>
            <button id="tab-completed" onclick="switchTab('已完成')" style="background: #ccc; color: #555; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px;">
                ✅ 歷史已完成
            </button>
        </div>

        <table class="order-table">
            <thead>
                <tr>
                    <th>訂單編號</th>
                    <th>時間</th>
                    <th>訂購人資料</th>
                    <th>外送/自取資訊</th>
                    <th>點購明細</th>
                    <th>總金額與狀態</th>
                </tr>
            </thead>
            <tbody id="order-list-body">
                </tbody>
        </table>
    </div>

    <script>
        // 紀錄目前所在的分頁狀態，預設一進來只看「處理中」的訂單
        let currentTab = '處理中'; 

        // 新增：切換分頁按鈕的函式
        function switchTab(status) {
            currentTab = status;
            
            // 抓取兩個按鈕元素
            const btnPending = document.getElementById('tab-pending');
            const btnCompleted = document.getElementById('tab-completed');

            // 根據切換的狀態，動態改變按鈕的高亮顏色
            if (status === '處理中') {
                btnPending.style.background = '#f4a261';
                btnPending.style.color = 'white';
                btnCompleted.style.background = '#ccc';
                btnCompleted.style.color = '#555';
            } else {
                btnPending.style.background = '#ccc';
                btnPending.style.color = '#555';
                btnCompleted.style.background = '#2a9d8f';
                btnCompleted.style.color = 'white';
            }

            // 重新刷一次畫面
            loadOrders();
        }

        // 載入並渲染所有訂單
        function loadOrders() {
            fetch('/api/orders')
                .then(res => res.json())
                .then(orders => {
                    const tbody = document.getElementById('order-list-body');
                    tbody.innerHTML = "";

                    // 🚀【核心分類邏輯】：根據目前 currentTab 的狀態，過濾出對應的訂單
                    const filteredOrders = orders.filter(order => order.status === currentTab);

                    // 如果該分頁沒有任何訂單，呈現提示字
                    if (filteredOrders.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#999; padding:40px;">目前沒有【${currentTab}】的訂單喔！</td></tr>`;
                        return;
                    }

                    // 改用過濾後的陣列 (filteredOrders) 進行畫面渲染
                    filteredOrders.forEach(order => {
                        // 解開存入時被轉成字串的購物車商品陣列
                        const items = JSON.parse(order.items);
                        
                        let itemsHtml = '<ul class="items-list">';
                        items.forEach(item => {
                            itemsHtml += `<li> ${item.name} x ${item.quantity} ($${item.price * item.quantity})</li>`;
                        });
                        itemsHtml += '</ul>';

                        // 格式化時間，呈現符合台灣習慣的格式
                        const orderTime = new Date(order.created_at).toLocaleString('zh-TW');

                        // 根據訂單狀態，決定要顯示什麼標籤與按鈕
                        let statusHtml = "";
                        if (order.status === '已完成') {
                            statusHtml = `<span style="display: inline-block; margin-top: 5px; color: #2a9d8f; font-weight: bold;">🟢 已完成</span>`;
                        } else {
                            statusHtml = `
                                <span style="display: inline-block; margin-top: 5px; color: #f4a261; font-weight: bold;">🟠 處理中</span>
                                <button onclick="completeOrder(${order.id})" style="display: block; margin-top: 8px; background: #2a9d8f; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;">
                                    ✅ 完成訂單
                                </button>
                            `;
                        }

                        // 額外加上：不論狀態如何，老闆都可以點擊的紅色的「刪除紀錄」按鈕
                        statusHtml += `
                            <button onclick="deleteOrder(${order.id})" style="display: block; margin-top: 8px; background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%;">
                                🗑️ 刪除紀錄
                            </button>
                        `;

                        tbody.innerHTML += `
                            <tr>
                                <td><strong>#${order.id}</strong></td>
                                <td style="font-size: 14px; color: #666;">${orderTime}</td>
                                <td>
                                    <strong>${order.name}</strong><br>
                                    <span style="font-size:14px; color:#666;">📞 ${order.phone}</span>
                                </td>
                                <td>${order.info}</td>
                                <td>${itemsHtml}</td>
                                <td>
                                    <div style="color:#e63946; font-size:18px; font-weight:bold; margin-bottom: 5px;">$${order.total}</div>
                                    <hr style="border:0; border-top:1px solid #eee; margin:5px 0;">
                                    ${statusHtml}
                                </td>
                            </tr>
                        `;
                    });
                })
                .catch(err => {
                    console.error("撈取訂單失敗:", err);
                });
        }

        // 點擊按鈕後將訂單改為已完成
        function completeOrder(id) {
            if (confirm(`確定要將訂單 #${id} 標記為已完成嗎？`)) {
                fetch(`/api/orders/${id}/complete`, {
                    method: 'POST'
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        loadOrders(); // 重新載入，該筆訂單會自動從「待處理」消失，跑到「歷史已完成」去！
                    } else {
                        alert("錯誤：" + data.message);
                    }
                })
                .catch(err => console.error("更新失敗:", err));
            }
        }

        // 點擊按鈕後刪除訂單
        function deleteOrder(id) {
            if (confirm(`⚠️ 警告：確定要永久刪除訂單 #${id} 嗎？`)) {
                fetch(`/api/orders/${id}`, {
                    method: 'DELETE'
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        loadOrders(); 
                    } else {
                        alert("錯誤：" + data.message);
                    }
                })
                .catch(err => console.error("刪除失敗:", err));
            }
        }

        // 網頁開啟時先載入一次訂單資料
        loadOrders();
    </script>
</body>
</html>
