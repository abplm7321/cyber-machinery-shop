<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>後台管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="navbar">
        <div class="logo">🛠️管理後台</div>
        <div>
            <a href="/">回前台首頁</a>
            <a href="/orders" style="margin-right: 20px; color: white; text-decoration: none;">📋 查看訂單</a>
        </div>
    </div>

    <div style="max-width: 500px; margin: 30px auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>上架新產品</h2>
        <form id="add-product-form" style="margin-top: 15px;">
            <div style="margin-bottom: 12px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">商品名稱：</label>
                <input type="text" id="p-name" required style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
            </div>
            <div style="margin-bottom: 12px;">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">商品價格：</label>
                <input type="number" id="p-price" required style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
            </div>
            <button type="submit" style="width:100%; background:#2a9d8f; color:white; padding:10px; border-radius:8px;">確認上架</button>
        </form>
    </div>

    <div style="max-width: 800px; margin: 30px auto; padding: 20px;">
        <h2>📦 目前架上商品 (可操作下架)</h2>
        <div id="admin-product-list" class="products" style="padding: 20px 0;">
            </div>
    </div>

    <script>
        // ==== 載入現有商品 ====
        function loadProducts() {
            fetch('/api/products')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('admin-product-list');
                    list.innerHTML = "";
                    data.forEach(product => {
                        list.innerHTML += `
                            <div class="card" style="padding: 15px;">
                                <h3>${product.name}</h3>
                                <p class="price">$${product.price}</p>
                                <button onclick="deleteProduct(${product.id}, '${product.name}')" style="width:100%; background:#ff4d4d; color:white; margin-top:10px;">
                                    ❌ 下架商品
                                </button>
                            </div>
                        `;
                    });
                });
        }

        // ==== 處理新增上架 ====
        document.getElementById('add-product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;

            fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert(data.message);
                    document.getElementById('add-product-form').reset();
                    loadProducts(); // 重新整理列表
                }
            });
        });

        // ==== 處理下架 ====
        function deleteProduct(id, name) {
            if (confirm(`確定要下架「${name}」嗎？`)) {
                fetch(`/api/products/${id}`, {
                    method: 'DELETE'
                })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        alert(data.message);
                        loadProducts(); // 重新整理列表
                    }
                });
            }
        }

        // 網頁開啟時先載入一次商品
        loadProducts();
    </script>
</body>
</html>
